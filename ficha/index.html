form{display:flex;flex-direction:column;flex:1}
.body{padding:22px 24px 8px;display:grid;gap:18px;align-content:start;flex:1}

      ?`${radios("diag",t.diag,t.diagO,{col:true})}${checks("reg",pick(t.reg),pick(t.regO))}${inp("regOutros",t.outros,{opt:true,attrs:'maxlength="120"'})}${radios("dor",t.dor,t.dorO)}${radios("inchaco",t.inch,t.inchO)}${ta("relato",t.relato,{opt:true,hint:t.relatoH})}${ta("tratamentos",t.trat,{opt:true,hint:t.tratH,quick:[t.none]})}`

  const N=PASSOS.length;

  function consultaTxt(){const c=new Date(info.consulta);const o={timeZone:"America/Sao_Paulo"};return c.toLocaleDateString(lang==="en"?"en-GB":lang==="es"?"es":"pt-BR",{...o,day:"2-digit",month:"2-digit"})+" · "+c.toLocaleTimeString("pt-BR",{...o,hour:"2-digit",minute:"2-digit"});}

  function ligar(){
    const t=T();
    const cpf=$("f-cpf");
    if(cpf){const f=()=>{const x=digitos(cpf.value).slice(0,11);if(BR())cpf.value=x.replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d{1,2})$/,"$1-$2");const e=$("e-cpf");if(x.length===11){const ok=cpfOk(x);e.className=ok?"okmsg":"err";e.textContent=ok?t.cpfOk:t.cpfBad;cpf.setAttribute("aria-invalid",String(!ok));}else{e.textContent="";cpf.removeAttribute("aria-invalid");}};cpf.addEventListener("input",f);if(cpf.value)f();}

    const cel=$("f-cel");if(cel&&BR())cel.addEventListener("input",()=>{let x=digitos(cel.value);if(x.startsWith("55")&&x.length>11)x=x.slice(2);x=x.slice(0,11);cel.value=x.length>6?`(${x.slice(0,2)}) ${x.slice(2,x.length-4)}-${x.slice(-4)}`:x.length>2?`(${x.slice(0,2)}) ${x.slice(2)}`:x;});
    const cep=$("f-cep");if(cep)cep.addEventListener("input",()=>{const x=digitos(cep.value).slice(0,8);cep.value=x.length>5?x.slice(0,5)+"-"+x.slice(5):x;if(x.length===8)buscaCep(x);});
    const uf=$("f-uf");if(uf)uf.addEventListener("input",()=>{uf.value=uf.value.toUpperCase().replace(/[^A-Z]/g,"").slice(0,2);});
    const ig=$("f-instagram");if(ig)ig.addEventListener("blur",()=>{const v=ig.value.trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i,"").replace(/[/?].*$/,"");ig.value=v&&!v.startsWith("@")?"@"+v:v;});
    document.querySelectorAll("[data-fill]").forEach(b=>b.addEventListener("click",()=>{const el=$("f-"+b.dataset.fill);el.value=b.dataset.v;el.focus();}));
    document.querySelectorAll('input[name="como"]').forEach(r=>r.addEventListener("change",()=>{$("w-quem").hidden=!(r.value==="1"||r.value==="2");}));
    document.querySelectorAll("[data-ir]").forEach(b=>b.addEventListener("click",()=>{step=+b.dataset.ir;render();window.scrollTo(0,0);}));
    document.querySelectorAll("#step input,#step textarea,#step select").forEach(el=>el.addEventListener("input",()=>{el.removeAttribute("aria-invalid");const e=$("e-"+el.name);if(e&&e.className==="err"&&el.name!=="cpf")e.textContent="";}));
  }
  async function buscaCep(x){
    try{const r=await(await fetch("https://viacep.com.br/ws/"+x+"/json/")).json();if(r.erro)return;
      [["rua",r.logradouro],["bairro",r.bairro],["cidade",r.localidade],["uf",r.uf]].forEach(([k,v])=>{const el=$("f-"+k);if(el&&v&&!el.value)el.value=v;});
      $("i-cep").textContent=T().cepOk;const n=$("f-numero");if(n&&!n.value)n.focus();
    }catch(e){}
  }
  function coletar(){
    const f=$("ficha");
    Object.keys(d).forEach(k=>{
      if(k==="cons"){if(f.elements.cons)d.cons=f.elements.cons.checked;return;}
      if(Array.isArray(d[k])){if(f.querySelector(`input[name="${k}"]`))d[k]=[...f.querySelectorAll(`input[name="${k}"]:checked`)].map(x=>+x.value);return;}
      if(f.querySelector(`input[type=radio][name="${k}"]`)){const el=f.querySelector(`input[name="${k}"]:checked`);d[k]=el?el.value:"";return;}
      const el=f.elements[k];if(el&&el.tagName)d[k]=String(el.value).trim();
    });
    salvar();
  }
  function validar(){
    const t=T(),erros=[];
    const marca=(k,msg)=>{erros.push(k);const el=$("f-"+k),e=$("e-"+k);if(el)el.setAttribute("aria-invalid","true");if(e){e.className="err";e.textContent=msg||t.need;}};
    if(step===0&&!d.apelido)marca("apelido");
    if(step===1){
      if(d.nome.split(/\s+/).filter(Boolean).length<2)marca("nome");
      if(BR()){if(!cpfOk(d.cpf))marca("cpf",d.cpf?t.cpfBad:t.need);}else{if(!d.documento)marca("documento");if(d.cpf&&!cpfOk(d.cpf))marca("cpf",t.cpfBad);}
      if(!idade(d.nasc))marca("nasc",d.nasc?t.nascBad:t.need);
      const c=digitos(d.cel);if(c.length<(BR()?10:8))marca("cel",d.cel?t.celBad:t.need);
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.mail))marca("mail",d.mail?t.mailBad:t.need);
    }
    if(step===2){if(BR()){["cep","rua","numero"].forEach(k=>{if(!d[k])marca(k);});if(d.cep&&digitos(d.cep).length!==8)marca("cep");}else{["pais","cidade"].forEach(k=>{if(!d[k])marca(k);});}}
    if(step===6&&!d.cons)marca("cons",t.consNeed);
    if(erros.length){const el=$("f-"+erros[0])||$("e-"+erros[0]);if(el){el.scrollIntoView({block:"center",behavior:"smooth"});if(el.focus)el.focus({preventScroll:true});}}
    return !erros.length;
  }
  // Envia em português para a equipe, qualquer que seja o idioma da paciente
  function payload(){
    const op=(arr,v)=>v===""||v==null?"":arr[+v];
    const tl=pick;
    return {nome:d.nome,apelido:d.apelido,cpf:d.cpf,documento:d.documento,rg:d.rg,nasc:d.nasc,sexo:op(PT.sexoO,d.sexo),estadoCivil:op(PT.civilO,d.estadoCivil),prof:d.prof,
      cel:BR()?"+55 "+d.cel:d.cel,mail:d.mail,instagram:d.instagram,cep:d.cep,rua:d.rua,numero:d.numero,compl:d.compl,bairro:d.bairro,cidade:d.cidade,uf:d.uf,pais:BR()?"":d.pais,end:d.end,
      alt:d.alt,peso:d.peso,diag:op(PT.diagO,d.diag),procedimento:op(PT.procO,d.procedimento),reg:d.reg.map(i=>tl(PT.regO)[i]),regOutros:d.regOutros,dor:op(PT.dorO,d.dor),inchaco:op(PT.inchO,d.inchaco),
      relato:d.relato,tratamentos:d.tratamentos,procAnteriores:d.procAnteriores,alergias:d.alergias,acompanhamento:d.acompanhamento,condicoes:d.condicoes,med:d.med,cirurgias:d.cirurgias,
      fumante:op(PT.fumaO,d.fumante),gatilho:d.gatilho,quer:d.quer,lipedef:op(PT.lipedefO,d.lipedef),decisao:op(PT.decisO,d.decisao),como:op(PT.comoO,d.como),quem:d.quem,plano:d.plano,historia:d.historia,cons:d.cons===true};
  }
  function turnstile(){
    if(!CFG.turnstile||$("ts").dataset.ok)return;$("ts").dataset.ok="1";
    const go=()=>window.turnstile.render("#ts",{sitekey:CFG.turnstile,language:lang==="pt"?"pt-br":lang,callback:v=>{tsToken=v;}});
    if(window.turnstile)go();else{const s=document.createElement("script");s.src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";s.async=true;s.onload=go;document.head.appendChild(s);}
  }
  async function enviar(){
    const t=T();
    if(CFG.turnstile&&!tsToken){$("e-envio").textContent=t.robo;return;}
    enviando=true;$("next").disabled=true;$("next").textContent=t.sending;$("back").disabled=true;$("e-envio").textContent="";
    try{
      const r=await fetch("/api/ficha",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({c:codigo||undefined,lang,ver,dados:payload(),hp:$("hp").value,ms:Date.now()-t0,ts:tsToken})});
      const j=await r.json().catch(()=>({}));
      if(r.status===404&&codigo){step=99;render();return;}
      if(!r.ok||!j.ok)throw new Error(j.erro||r.status);
      try{sessionStorage.removeItem(CHAVE);}catch(e){}
      step=N;render();window.scrollTo(0,0);
    }catch(e){$("e-envio").textContent=t.fail;if(window.turnstile&&CFG.turnstile){try{window.turnstile.reset("#ts");}catch(x){}tsToken="";}}
    finally{enviando=false;$("next").disabled=false;$("back").disabled=false;if(step===N-1)$("next").textContent=t.send;}
  }

  $("ficha").addEventListener("submit",e=>{
    e.preventDefault();if(enviando)return;coletar();
    if(!validar())return;
    if(step===N-1){enviar();return;}
    step++;render();window.scrollTo(0,0);
    const first=document.querySelector("#step input:not([type=radio]):not([type=checkbox]),#step textarea");if(first&&step<N-1&&!first.value)first.focus({preventScroll:true});
  });
  $("back").addEventListener("click",()=>{coletar();step=Math.max(0,step-1);render();window.scrollTo(0,0);});
  document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>{coletar();lang=b.dataset.l;render();}));
  render();
  if(codigo){fetch("/api/ficha?c="+encodeURIComponent(codigo)).then(r=>r.status===404?Promise.reject(404):r.json()).then(j=>{if(j.ok){info=j;if(!d.apelido&&j.nome)d.apelido=j.nome;render();}}).catch(s=>{if(s===404){step=99;render();}});}
})();
</script>
